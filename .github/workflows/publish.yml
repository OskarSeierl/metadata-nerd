name: Build and Release

on:
  release:
    types: [published]

# This is absolutely necessary so the action has permission to upload files to your release
permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Builds across all three OS platforms in parallel
        os: [windows-2022, ubuntu-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build and Upload Assets
        run: npm run release
        env:
          # This token is automatically provided by GitHub.
          # electron-builder uses it to upload the artifacts to your existing release.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
